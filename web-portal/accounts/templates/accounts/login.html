<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Đăng nhập</title>
</head>

<body>
    <h2>Đăng nhập</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}<p style="color:red">Sai tên đăng nhập hoặc mật khẩu.</p>{% endif %}
        <p><input type="text" name="username" placeholder="Tên đăng nhập" required></p>
        <p><input type="password" name="password" placeholder="Mật khẩu" required></p>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Đăng nhập</button>
    </form>
</body>

</html>
