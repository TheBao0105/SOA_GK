{% extends 'portal/base.html' %}

<form method="post" class="card card-body" style="max-width:600px">{% csrf_token %}{{ form.as_p }}<p class="text-muted">Lưu điểm để sinh viên xem ngay. Có thể sửa lại khi cần; hệ thống ghi nhận lịch sử thay đổi.</p><div><a class="btn btn-secondary" href="{% url 'grade_list' %}">Quay lại</a> <button class="btn btn-primary">Lưu điểm</button></div></form>{% endblock %}
